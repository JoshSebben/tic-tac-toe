<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="buttons">
        <button id="start">Start</button>
        <button id="restart">Restart</button>
    </div>
    
    <div id="board">
        <div class="grid-item" id="top-left"></div>
        <div class="grid-item" id="top-mid"></div>
        <div class="grid-item" id="top-right"></div>
        <div class="grid-item" id="mid-left"></div>
        <div class="grid-item" id="middle"></div>
        <div class="grid-item" id="mid-right"></div>
        <div class="grid-item" id="bottom-left"></div>
        <div class="grid-item" id="bottom-mid"></div>
        <div class="grid-item" id="bottom-right"></div>
    </div>
    
</body>
</html>
