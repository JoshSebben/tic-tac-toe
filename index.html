<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="buttons">
        <button id="start">Start</button>
        <button id="restart">Restart</button>
    </div>
    
    <div id="container">
        <div id="board">
            <div class="grid-item" id="top-left">
                <button></button>
            </div>
    
            <div class="grid-item" id="top-mid">
                <button></button>
            </div>
    
            <div class="grid-item" id="top-right">
                <button></button>
            </div>
    
            <div class="grid-item" id="mid-left">
                <button></button>
            </div>
    
            <div class="grid-item" id="middle">
                <button></button>
            </div>
    
            <div class="grid-item" id="mid-right">
                <button></button>
            </div>
    
            <div class="grid-item" id="bottom-left">
                <button></button>
            </div>
    
            <div class="grid-item" id="bottom-mid">
                <button></button>
            </div>
            
            <div class="grid-item" id="bottom-right">
                <button></button>
            </div>
        </div>

        <div id="display">
            <h2>Display</h2>
        </div>

    </div>
    
    
    <script src="script.js"></script>
</body>
</html>
